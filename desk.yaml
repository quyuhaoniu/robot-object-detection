# 桌面物体检测数据集
# 用法: yolo train data=desk.yaml model=yolov8n.pt epochs=100 imgsz=640

path: datasets/desk   # 数据集根目录（相对项目根目录）
train: images/train   # 训练图片（相对 path）
val: images/val       # 验证图片（相对 path）
test: images/test     # 测试图片（相对 path）

# 类别：编号顺序必须和你标注时用的编号一致！
names:
  0: keyboard    
  1: laptop   
